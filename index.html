<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="header-row">
                <h2>My Social</h2>
                <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
            </div>
            
            <div class="profile-card">
                <div class="avatar" id="avatarIcon">M</div>
                <h3 id="profileName">Mirudhula</h3>
                <p id="profileHandle">@mirudhula</p>
                <button id="followBtn" onclick="toggleFollow()">Follow</button>
                
                <div class="stats">
                    <div>
                        <strong id="followersCount">120</strong>
                        <p>Followers</p>
                    </div>
                    <div>
                        <strong id="followingCount">45</strong>
                        <p>Following</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Feed -->
        <div class="feed-container">
            <!-- Search Posts Bar -->
            <div class="search-card">
                <input type="text" id="searchInput" placeholder="🔍 Search posts by content..." onkeyup="filterPosts()">
            </div>

            <!-- Create Post Card -->
            <div class="create-post-card">
                <h3>Create Post</h3>
                <textarea id="postInput" placeholder="What's on your mind?"></textarea>
                
                <!-- Image Preview Container -->
                <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                    <img id="imagePreview" src="" alt="Selected Preview">
                    <button class="remove-img-btn" onclick="removeSelectedImage()">❌</button>
                </div>

                <div class="post-upload-bar">
                    <label for="imageInput" class="upload-btn">
                        📷 Photo / Image
                    </label>
                    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" style="display: none;">
                    
                    <button onclick="addPost()">Share Post</button>
                </div>
            </div>

            <!-- Posts List Feed -->
            <div id="postsFeed"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
